apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cron
  labels:
    app: {{ .Release.Name }}-cron
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  timeZone: {{ .Values.cron.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cron.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cron.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}-cron
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cron
              image: "{{ .Values.cron.image.repository }}:{{ .Values.cron.image.tag }}"
              imagePullPolicy: {{ .Values.cron.image.pullPolicy }}
              # The image entrypoint is `uv run horizon`; re-run it via sh to
              # compute yesterday's UTC date (matches the --date UTC semantics).
              # chmod keeps summaries world-readable so the viewer pod's
              # non-root nginx worker can serve them (also repairs any legacy 600 files).
              # After the report is written, each language is converted to a
              # Teams Adaptive Card (--json) and sent to the webhook
              # (--trigger; URL comes from $HORIZON_TEAMS_WEBHOOK_URL, viewer
              # links from teams.viewer_base_url in config.json).
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  D=$(date -u -d yesterday +%F) &&
                  uv run horizon --date "$D" &&
                  chmod -R a+rX /app/data/summaries &&
                  uv run horizon --json "data/summaries/horizon-$D-zh.md" &&
                  uv run horizon --trigger "data/teams/horizon-$D-zh.json" &&
                  uv run horizon --json "data/summaries/horizon-$D-ja.md" &&
                  uv run horizon --trigger "data/teams/horizon-$D-ja.json"
              resources:
                {{- toYaml .Values.cron.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /app/data
                - name: secret
                  mountPath: /app/.env
                  subPath: env
                - name: secret
                  mountPath: /app/data/config.json
                  subPath: config.json
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-data
            - name: secret
              secret:
                secretName: {{ .Release.Name }}-secret

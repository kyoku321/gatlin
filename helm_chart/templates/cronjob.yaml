apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-cron
  labels:
    app: {{ .Release.Name }}-cron
spec:
  schedule: {{ .Values.cron.schedule | quote }}
  timeZone: {{ .Values.cron.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.cron.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cron.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: {{ .Release.Name }}-cron
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cron
              image: "{{ .Values.cron.image.repository }}:{{ .Values.cron.image.tag }}"
              imagePullPolicy: {{ .Values.cron.image.pullPolicy }}
              env:
                # Container clock / shell date / python logs in Japan time.
                - name: TZ
                  value: Asia/Tokyo
              # The image entrypoint is `uv run horizon`; re-run it via sh to
              # compute yesterday's JST date (the cron runs at 21:00 JST and
              # digests the previous Asia/Tokyo calendar day).
              # chmod keeps summaries world-readable so the viewer pod's
              # non-root nginx worker can serve them (also repairs any legacy 600 files).
              # After the report is written, each language is converted to a
              # Teams Adaptive Card (--json) and sent to its own webhook
              # (--trigger --webhook-env HORIZON_TEAMS_WEBHOOK_URL_ZH / _JA;
              # viewer links come from teams.viewer_base_url in config.json).
              # NOTE: args is a folded scalar (`>-`) joined into ONE line, so
              # `#` here would comment out the rest of the shell command —
              # never write commented-out commands inside this block.
              # ZH Teams push is disabled for now; when re-enabling add:
              #   uv run horizon --json "data/summaries/horizon-$D-zh.md" &&
              #   uv run horizon --trigger "data/teams/horizon-$D-zh.json" --webhook-env HORIZON_TEAMS_WEBHOOK_URL_ZH &&
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  D=$(TZ=Asia/Tokyo date -d yesterday +%F) &&
                  uv run horizon --date "$D" &&
                  chmod -R a+rX /app/data/summaries &&
                  uv run horizon --json "data/summaries/horizon-$D-ja.md" &&
                  uv run horizon --trigger "data/teams/horizon-$D-ja.json" --webhook-env HORIZON_TEAMS_WEBHOOK_URL_JA
              resources:
                {{- toYaml .Values.cron.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /app/data
                - name: secret
                  mountPath: /app/.env
                  subPath: env
                - name: secret
                  mountPath: /app/data/config.json
                  subPath: config.json
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-data
            - name: secret
              secret:
                secretName: {{ .Release.Name }}-secret

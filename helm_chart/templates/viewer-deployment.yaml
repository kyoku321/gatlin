apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-viewer
  labels:
    app: {{ .Release.Name }}-viewer
spec:
  replicas: {{ .Values.viewer.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-viewer
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-viewer
    spec:
      containers:
        - name: viewer
          image: "{{ .Values.viewer.image.repository }}:{{ .Values.viewer.image.tag }}"
          imagePullPolicy: {{ .Values.viewer.image.pullPolicy }}
          env:
            # Access-log timestamps in Japan time (nginx:1.28-alpine ships
            # without tzdata; the image adds it).
            - name: TZ
              value: Asia/Tokyo
          ports:
            - containerPort: {{ .Values.viewer.containerPort }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.viewer.containerPort }}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.viewer.containerPort }}
            initialDelaySeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            {{- toYaml .Values.viewer.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: nginx-config
          configMap:
            name: {{ .Release.Name }}-viewer-nginx

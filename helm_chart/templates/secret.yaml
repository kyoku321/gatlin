{{- $env := .Values.secrets.env | default "" }}
{{- $cfg := required "secrets.configJson is required (paste the contents of data/config.json)" .Values.secrets.configJson }}
{{- /* Fail fast at install/upgrade time if configJson is not a valid JSON object.
     (Helm's fromJson returns {"Error": ...} instead of raising, so check manually.) */ -}}
{{- $parsed := fromJson $cfg }}
{{- if and (hasKey $parsed "Error") (eq (len $parsed) 1) }}
{{- fail (printf "secrets.configJson is not valid JSON: %s" (index $parsed "Error")) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app: {{ .Release.Name }}-secret
type: Opaque
stringData:
  env: |
    {{- $env | nindent 4 }}
  config.json: |
    {{- $cfg | nindent 4 }}
